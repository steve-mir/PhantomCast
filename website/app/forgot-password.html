<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Phantom Cast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-pc-section="auth">
  <div data-pc-header></div>

  <section class="py-16 min-h-[80vh] flex items-center">
    <div class="container-pc max-w-md w-full">
      <div class="card p-8">
        <h1 class="text-2xl font-bold mb-1">Reset your password.</h1>
        <p class="text-sm text-[var(--text-muted)] mb-6">We'll email you a one-time link.</p>

        <form class="space-y-4" onsubmit="event.preventDefault(); document.getElementById('done').classList.remove('hidden')">
          <div><label class="label" for="email">Email</label><input class="field" id="email" type="email" required autocomplete="email" /></div>
          <button class="btn btn-primary w-full" type="submit">Send reset link</button>
          <div id="done" class="hidden chip chip-success w-full justify-center py-2"><i data-lucide="check" class="w-3.5 h-3.5"></i> If an account exists, the email is on its way.</div>
        </form>

        <p class="text-xs text-center text-[var(--text-dim)] mt-6"><a href="login.html" class="text-cyan-400 hover:underline">← Back to sign in</a></p>
      </div>
    </div>
  </section>

  <div data-pc-footer></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/partials.js"></script>
</body>
</html>
