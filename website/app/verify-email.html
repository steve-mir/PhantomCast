<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify your email — Phantom Cast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-pc-section="auth">
  <div data-pc-header></div>

  <section class="py-16 min-h-[80vh] flex items-center">
    <div class="container-pc max-w-md w-full text-center">
      <div class="card p-10">
        <div class="inline-flex w-16 h-16 rounded-full gradient-bg-soft items-center justify-center mb-5">
          <i data-lucide="mail" class="w-8 h-8 gradient-text"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2">Check your email.</h1>
        <p class="text-sm text-[var(--text-muted)] mb-6">We've sent a verification link. Click it to activate your account, then come back to sign in.</p>
        <a href="login.html" class="btn btn-secondary w-full">Back to sign in</a>
        <div class="text-xs text-[var(--text-dim)] mt-5">Didn't get it? Check spam, or <a href="#" class="text-cyan-400">resend the email</a>.</div>
      </div>
    </div>
  </section>

  <div data-pc-footer></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/partials.js"></script>
</body>
</html>
